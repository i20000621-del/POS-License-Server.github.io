services:
  - type: web
    name: pos-license-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pos-license-db
          property: connectionString
databases:
  - name: pos-license-db
    databaseName: pos_license
    user: pos_license
